# Builds the AppImage + RPM and publishes a GitHub Release when a version tag
# is pushed (e.g. `npm run release`, which bumps the version and pushes v*).
# The AppImage's built-in updater (electron-updater) reads latest-linux.yml
# from the newest release and downloads only the changed blocks.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Check tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          pkg="v$(node -p "require('./package.json').version")"
          if [ "$pkg" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${pkg}" >&2
            exit 1
          fi

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends rpm imagemagick

      - run: npm ci

      - run: npm audit --omit=dev --audit-level=high

      - name: Build and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm run build
          npx electron-builder --linux AppImage rpm --publish always
